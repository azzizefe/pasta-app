# /etc/nginx/sites-available/lumiere-api
# api.ALANADIN.com kısmını kendi alan adınla değiştir.
# HTTPS satırlarını certbot otomatik ekler.

limit_req_zone $binary_remote_addr zone=lumiere_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.ALANADIN.com;

    # İlham fotoğrafı base64 olarak geldiği için gövde sınırı biraz büyük
    client_max_body_size 12m;
    server_tokens off;

    location / {
        limit_req zone=lumiere_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 4K görsel ve uzun tarif üretimi zaman alabilir
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
